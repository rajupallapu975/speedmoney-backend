version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: speedmoney-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speedmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SpeedMoney2026Secure!}
      POSTGRES_DB: ${POSTGRES_DB:-loan_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speedmoney} -d ${POSTGRES_DB:-loan_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedmoney-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-speedmoney}:${POSTGRES_PASSWORD:-SpeedMoney2026Secure!}@db:5432/${POSTGRES_DB:-loan_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:-speedmoney_jwt_secret_key_prod_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    env_file:
      - ./backend/.env

volumes:
  pgdata:
